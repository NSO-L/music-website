<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝贝 - 原创音乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #f093fb;
            --dark: #0f0f23;
            --light: #ffffff;
        }

        body {
            min-height: 100vh;
            background: var(--dark);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
            color: var(--light);
        }

        /* 动态星空背景 */
        .universe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 流星效果 */
        .meteor {
            position: absolute;
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent);
            animation: meteor 3s linear infinite;
            opacity: 0;
        }

        @keyframes meteor {
            0% { opacity: 0; transform: translateX(0) translateY(0); }
            10% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-300px) translateY(200px); }
        }

        /* 极光效果 */
        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(180deg, 
                rgba(102, 126, 234, 0.1) 0%, 
                rgba(118, 75, 162, 0.05) 50%, 
                transparent 100%);
            animation: aurora 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes aurora {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 0.6; transform: translateY(-20px); }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 标题区域 */
        .hero {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-badge {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -2px;
            text-shadow: 0 0 80px rgba(240, 147, 251, 0.3);
        }

        .hero-subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            letter-spacing: 8px;
        }

        /* 音乐播放器卡片 */
        .player-card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 100px rgba(102, 126, 234, 0.1),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            animation: fadeInUp 1s ease-out 0.3s both;
            position: relative;
            overflow: hidden;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .player-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--primary), transparent, var(--secondary), transparent);
            animation: rotate 10s linear infinite;
            opacity: 0.1;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        /* 专辑封面 */
        .album-artwork {
            width: 280px;
            height: 280px;
            margin: 0 auto 35px;
            position: relative;
            cursor: pointer;
        }

        .album-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
            position: relative;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(102, 126, 234, 0.2),
                inset 0 0 60px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .album-disc:hover {
            transform: scale(1.05);
            box-shadow: 
                0 25px 70px rgba(0, 0, 0, 0.6),
                0 0 100px rgba(102, 126, 234, 0.3);
        }

        .album-disc.playing {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .album-disc::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle at center,
                transparent 0px,
                transparent 10px,
                rgba(255, 255, 255, 0.03) 10px,
                rgba(255, 255, 255, 0.03) 11px
            );
        }

        .album-center {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
            z-index: 1;
        }

        .album-icon {
            font-size: 2.5rem;
        }

        /* 音轨信息 */
        .track-info {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .track-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, rgba(255, 255, 255, 0.8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .track-artist {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
        }

        /* 进度条 */
        .progress-section {
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--light);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.8);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar-bg:hover .progress-bar-fill::after {
            opacity: 1;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            font-variant-numeric: tabular-nums;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            padding: 10px;
        }

        .ctrl-btn:hover {
            color: var(--light);
            transform: scale(1.1);
        }

        .play-pause-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 1.8rem;
            box-shadow: 
                0 15px 40px rgba(102, 126, 234, 0.4),
                0 0 60px rgba(102, 126, 234, 0.2);
            transition: all 0.3s ease;
        }

        .play-pause-btn:hover {
            transform: scale(1.1);
            box-shadow: 
                0 20px 50px rgba(102, 126, 234, 0.5),
                0 0 80px rgba(102, 126, 234, 0.3);
        }

        .play-pause-btn:active {
            transform: scale(0.95);
        }

        /* 音量控制 */
        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .volume-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        .volume-btn:hover {
            color: var(--light);
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
            transition: transform 0.2s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 频谱可视化 */
        .spectrum {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 50px;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }

        .spectrum-bar {
            width: 6px;
            background: linear-gradient(to top, var(--primary), var(--accent));
            border-radius: 3px;
            transition: height 0.1s ease;
            opacity: 0.7;
        }

        /* 关于区域 */
        .about-section {
            margin-top: 80px;
            text-align: center;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .about-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.9);
        }

        .about-text {
            max-width: 600px;
            margin: 0 auto;
            font-size: 1rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.5);
        }

        /* 标签 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        .tag {
            padding: 10px 22px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 25px;
            font-size: 0.9rem;
            color: var(--primary);
            transition: all 0.3s ease;
            cursor: default;
        }

        .tag:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        /* 页脚 */
        footer {
            margin-top: 80px;
            text-align: center;
            animation: fadeInUp 1s ease-out 0.9s both;
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        /* 键盘提示 */
        .keyboard-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            z-index: 100;
            opacity: 0;
            animation: fadeIn 1s ease-out 1.5s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
            margin: 0 3px;
            font-family: inherit;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .hero-title {
                font-size: 2.5rem;
            }
            
            .hero-subtitle {
                font-size: 1rem;
                letter-spacing: 4px;
            }
            
            .player-card {
                padding: 40px 25px;
            }
            
            .album-artwork {
                width: 220px;
                height: 220px;
            }
            
            .album-center {
                width: 60px;
                height: 60px;
            }
            
            .album-icon {
                font-size: 2rem;
            }
            
            .track-name {
                font-size: 1.4rem;
            }
            
            .keyboard-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 宇宙背景 -->
    <div class="universe" id="universe"></div>
    
    <!-- 极光 -->
    <div class="aurora"></div>

    <div class="container">
        <!-- 标题 -->
        <div class="hero">
            <div class="hero-badge">♪ 原创音乐</div>
            <h1 class="hero-title">宝贝</h1>
            <p class="hero-subtitle">BAO BEI</p>
        </div>

        <!-- 播放器 -->
        <div class="player-card">
            <!-- 专辑封面 -->
            <div class="album-artwork">
                <div class="album-disc" id="albumDisc">
                    <div class="album-center">
                        <span class="album-icon">🎵</span>
                    </div>
                </div>
            </div>

            <!-- 音轨信息 -->
            <div class="track-info">
                <h2 class="track-name">宝贝</h2>
                <p class="track-artist">原创作品</p>
            </div>

            <!-- 进度条 -->
            <div class="progress-section">
                <div class="progress-bar-bg" id="progressBar">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <div class="time-row">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="controls">
                <button class="ctrl-btn" id="prevBtn" title="上一首">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="playPauseBtn">▶</button>
                <button class="ctrl-btn" id="nextBtn" title="下一首">⏭</button>
            </div>

            <!-- 音量控制 -->
            <div class="volume-control">
                <button class="volume-btn" id="volumeBtn">🔊</button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
            </div>

            <!-- 频谱可视化 -->
            <div class="spectrum" id="spectrum">
                <div class="spectrum-bar" style="height: 15px;"></div>
                <div class="spectrum-bar" style="height: 25px;"></div>
                <div class="spectrum-bar" style="height: 35px;"></div>
                <div class="spectrum-bar" style="height: 20px;"></div>
                <div class="spectrum-bar" style="height: 40px;"></div>
                <div class="spectrum-bar" style="height: 30px;"></div>
                <div class="spectrum-bar" style="height: 45px;"></div>
                <div class="spectrum-bar" style="height: 35px;"></div>
                <div class="spectrum-bar" style="height: 25px;"></div>
                <div class="spectrum-bar" style="height: 15px;"></div>
                <div class="spectrum-bar" style="height: 30px;"></div>
                <div class="spectrum-bar" style="height: 40px;"></div>
                <div class="spectrum-bar" style="height: 20px;"></div>
                <div class="spectrum-bar" style="height: 35px;"></div>
                <div class="spectrum-bar" style="height: 25px;"></div>
            </div>
        </div>

        <!-- 关于 -->
        <div class="about-section">
            <h3 class="about-title">关于这首音乐</h3>
            <p class="about-text">
                这是一首充满情感与温度的原创音乐作品。<br>
                每一个音符都承载着创作者的心意，<br>
                如同宝贝般珍贵。
            </p>
            <div class="tags">
                <span class="tag">🎵 原创</span>
                <span class="tag">💝 情感</span>
                <span class="tag">🎧 聆听</span>
                <span class="tag">✨ 心动</span>
            </div>
        </div>

        <!-- 页脚 -->
        <footer>
            <p class="footer-text">© 2024 宝贝 · 原创音乐</p>
        </footer>
    </div>

    <!-- 键盘提示 -->
    <div class="keyboard-hint">
        <kbd>空格</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> 快退/快进
    </div>

    <!-- 音频 -->
    <audio id="audio" preload="metadata">
        <source src="宝贝.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 创建星空
        function createStars() {
            const universe = document.getElementById('universe');
            const starCount = 200;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = Math.random() * 5 + 's';
                universe.appendChild(star);
            }

            // 创建流星
            for (let i = 0; i < 3; i++) {
                const meteor = document.createElement('div');
                meteor.className = 'meteor';
                meteor.style.left = (Math.random() * 50 + 50) + '%';
                meteor.style.top = Math.random() * 30 + '%';
                meteor.style.animationDelay = (i * 5 + Math.random() * 3) + 's';
                universe.appendChild(meteor);
            }
        }
        createStars();

        // 播放器控制
        const audio = document.getElementById('audio');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const albumDisc = document.getElementById('albumDisc');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeBtn = document.getElementById('volumeBtn');
        const spectrum = document.getElementById('spectrum');
        const spectrumBars = spectrum.querySelectorAll('.spectrum-bar');

        let isPlaying = false;
        let animationId;

        // 格式化时间
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // 播放/暂停
        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playPauseBtn.textContent = '▶';
                albumDisc.classList.remove('playing');
                cancelAnimationFrame(animationId);
            } else {
                audio.play().catch(() => {});
                playPauseBtn.textContent = '⏸';
                albumDisc.classList.add('playing');
                animateSpectrum();
            }
            isPlaying = !isPlaying;
        }

        playPauseBtn.addEventListener('click', togglePlay);
        albumDisc.addEventListener('click', togglePlay);

        // 频谱动画
        function animateSpectrum() {
            if (!isPlaying) return;
            
            spectrumBars.forEach(bar => {
                const height = Math.random() * 40 + 10;
                bar.style.height = height + 'px';
            });
            
            animationId = requestAnimationFrame(animateSpectrum);
        }

        // 进度更新
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        // 点击进度条
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        // 音量控制
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            updateVolumeIcon();
        });

        function updateVolumeIcon() {
            if (audio.volume === 0) {
                volumeBtn.textContent = '🔇';
            } else if (audio.volume < 0.5) {
                volumeBtn.textContent = '🔉';
            } else {
                volumeBtn.textContent = '🔊';
            }
        }

        volumeBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            volumeBtn.textContent = audio.muted ? '🔇' : '🔊';
        });

        // 播放结束
        audio.addEventListener('ended', () => {
            isPlaying = false;
            playPauseBtn.textContent = '▶';
            albumDisc.classList.remove('playing');
            progressFill.style.width = '0%';
            cancelAnimationFrame(animationId);
            
            spectrumBars.forEach((bar, i) => {
                bar.style.height = (Math.sin(i * 0.5) * 15 + 25) + 'px';
            });
        });

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.code === 'ArrowRight') {
                audio.currentTime = Math.min(audio.currentTime + 10, audio.duration);
            } else if (e.code === 'ArrowLeft') {
                audio.currentTime = Math.max(audio.currentTime - 10, 0);
            }
        });

        // 上一首/下一首（重播当前）
        document.getElementById('prevBtn').addEventListener('click', () => {
            audio.currentTime = 0;
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            audio.currentTime = 0;
            if (!isPlaying) togglePlay();
        });
    </script>
</body>
</html>
